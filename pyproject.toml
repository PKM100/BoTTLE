[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottle-bench"
version = "0.1.0"
description = "BoTTLE: Benchmark of Task-level Total Latency & Energy for robot foundation models, estimated without owning the hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
profile = ["torch>=2.1"]
energy = ["nvidia-ml-py>=12"]
dev = ["pytest>=7"]

[project.scripts]
bottle = "bottlebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
